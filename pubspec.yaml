name: Duitku
description: "DuitKu - Aplikasi Manajemen Keuangan Harian (versi Flutter/Android)"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  intl: ^0.19.0
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6
  file_picker: ^10.3.7
  flutter_launcher_icons: ^0.14.3
  material_color_utilities: ^0.13.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
